# =============================================================================
# Publish Package → GitHub Packages (npm)
# =============================================================================
# Descripción:
#   Este workflow compila la librería @makrozai/nayra-ui, ejecuta los tests
#   unitarios y publica el paquete en GitHub Packages cada vez que se hace
#   push a master.
#
# Para consumir el paquete desde otro proyecto:
#   1. Crear un .npmrc con: @makrozai:registry=https://npm.pkg.github.com
#   2. Autenticarse: npm login --scope=@makrozai --registry=https://npm.pkg.github.com
#   3. Instalar: pnpm add @makrozai/nayra-ui
#
# El token GITHUB_TOKEN se provee automáticamente por GitHub Actions.
# =============================================================================

name: Publish Package

on:
  push:
    branches: ["master"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  publish-package:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código fuente
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      # 3. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # 4. Instalar dependencias (lockfile estricto)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Escribir auth token en .npmrc (pnpm no lee NPM_CONFIG_USERCONFIG de setup-node)
      - name: Configure auth for GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. Generar exports dinámicos (barrel files + prefijos)
      - name: Generate exports
        run: pnpm prebuild

      # 7. Compilar librería (type-check + vite build + .d.ts)
      - name: Build library
        run: pnpm build

      # 8. Ejecutar tests unitarios
      - name: Run unit tests
        run: pnpm test

      # 9. Verificar si la versión ya fue publicada (evita 409 Conflict en reintento)
      - name: Check if version already published
        id: version_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if pnpm view @makrozai/nayra-ui@${VERSION} version --registry https://npm.pkg.github.com 2>/dev/null; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION ya existe en GitHub Packages, se omite el publish."
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION no existe, se procederá a publicar."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 10. Publicar a GitHub Packages
      - name: Publish to GitHub Packages
        if: steps.version_check.outputs.already_published == 'false'
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
